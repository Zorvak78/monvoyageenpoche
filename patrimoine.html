<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Patrimoine — Gestion personnelle & SARL ALPEGA</title>
<meta name="description" content="Application autonome de gestion de patrimoine personnel et de suivi d'entreprise (SARL ALPEGA). Données locales, export JSON/CSV, synchronisation Supabase optionnelle.">
<meta name="theme-color" content="#f9f9f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Patrimoine">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232a78d6'/%3E%3Cpath d='M14 42l11-13 9 8 16-19' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232a78d6'/%3E%3Cpath d='M14 42l11-13 9 8 16-19' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* ============================== TOKENS ============================== */
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f2f1ed; --surface-3:#eceae4;
  --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --border-strong:rgba(11,11,11,.18);
  --shadow:0 1px 2px rgba(11,11,11,.04), 0 8px 24px rgba(11,11,11,.05);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --pos:#006300; --neg:#d03b3b;
  --accent:#2a78d6; --accent-ink:#fff; --accent-soft:rgba(42,120,214,.10);
  --r-sm:8px; --r:12px; --r-lg:16px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --surface-3:#2c2c2a;
    --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.20);
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.35);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --pos:#0ca30c; --neg:#e66767;
    --accent:#3987e5; --accent-soft:rgba(57,135,229,.16);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321; --surface-3:#2c2c2a;
  --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --border-strong:rgba(255,255,255,.20);
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px rgba(0,0,0,.35);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --pos:#0ca30c; --neg:#e66767;
  --accent:#3987e5; --accent-soft:rgba(57,135,229,.16);
}
/* ============================== BASE ============================== */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--page); color:var(--ink);
  font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
h1,h2,h3,h4{margin:0;font-weight:640;letter-spacing:-.01em}
h1{font-size:1.5rem} h2{font-size:1.125rem} h3{font-size:.95rem}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sec{color:var(--ink-2)}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* ============================== APP SHELL ============================== */
.app{display:flex;min-height:100dvh}
.sidebar{
  width:246px;flex:0 0 246px;position:sticky;top:0;height:100dvh;
  background:var(--surface);border-right:1px solid var(--border);
  padding:18px 12px;display:flex;flex-direction:column;gap:4px;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px}
.brand-mark{width:32px;height:32px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:0 0 auto}
.brand-mark svg{width:19px;height:19px}
.brand-t{font-weight:680;font-size:.95rem;letter-spacing:-.01em}
.brand-s{font-size:.72rem;color:var(--muted)}
.nav-link{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r);
  color:var(--ink-2);text-decoration:none;font-size:.9rem;font-weight:500;
  border:none;background:none;width:100%;text-align:left;cursor:pointer;
}
.nav-link svg{width:18px;height:18px;flex:0 0 auto;opacity:.85}
.nav-link:hover{background:var(--surface-2);color:var(--ink)}
.nav-link.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-sep{height:1px;background:var(--border);margin:10px 8px}
.side-foot{margin-top:auto;padding:10px 8px 0;font-size:.72rem;color:var(--muted)}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;background:var(--page);
  border-bottom:1px solid var(--border);
  padding:12px 24px;display:flex;align-items:center;gap:12px;
}
.topbar h1{font-size:1.15rem}
.topbar-sub{font-size:.78rem;color:var(--muted);margin-top:1px}
.topbar-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.container{padding:20px 24px 40px;max-width:1240px;width:100%;margin:0 auto}
.tabbar{display:none}
/* ============================== CONTROLS ============================== */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:8px 13px;border-radius:10px;border:1px solid var(--border-strong);
  background:var(--surface);color:var(--ink);font-size:.86rem;font-weight:560;
  cursor:pointer;white-space:nowrap;transition:background .12s,border-color .12s,transform .06s;
}
.btn:hover{background:var(--surface-2)}
.btn:active{transform:translateY(1px)}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--accent);color:#fff;border-color:transparent}
.btn-primary:hover{filter:brightness(1.07);background:var(--accent)}
.btn-ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn-ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn-danger{color:var(--crit);border-color:var(--border-strong)}
.btn-danger:hover{background:rgba(208,59,59,.10)}
.btn-sm{padding:5px 9px;font-size:.79rem;border-radius:8px}
.btn-icon{padding:7px;border-radius:9px}
.btn-icon svg{width:17px;height:17px}
.seg{display:inline-flex;gap:2px;background:var(--surface-2);border-radius:11px;padding:3px;border:1px solid var(--border);overflow-x:auto;max-width:100%;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{
  border:none;background:none;padding:6px 12px;border-radius:8px;font-size:.83rem;
  font-weight:540;color:var(--ink-2);cursor:pointer;white-space:nowrap;
}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:620}
select,input,textarea{
  font:inherit;font-size:.88rem;color:var(--ink);background:var(--surface);
  border:1px solid var(--border-strong);border-radius:10px;padding:8px 10px;width:100%;
}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}
input[type="checkbox"]{width:17px;height:17px;accent-color:var(--accent)}
input::placeholder,textarea::placeholder{color:var(--muted)}
.inline-select{width:auto;min-width:120px;padding:7px 30px 7px 10px;font-size:.84rem}
label{font-size:.8rem;color:var(--ink-2);font-weight:540}
/* ============================== CARDS / GRID ============================== */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:16px 18px}
.card+.card{margin-top:14px}
.card-h{display:flex;align-items:center;gap:10px 12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2,.card-h h3{margin:0}
.card-h .right{margin-left:auto;display:flex;gap:8px;align-items:center}
.grid{display:grid;gap:14px}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-auto{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g-side{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);align-items:start}
.g-side2{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);align-items:start}
.g-wide{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}
.g-half{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
.span-2{grid-column:span 2}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:14px}
/* stat tiles */
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:14px 16px;box-shadow:var(--shadow)}
.stat-l{font-size:.78rem;color:var(--muted);font-weight:540;display:flex;align-items:center;gap:6px}
.stat-v{font-size:1.6rem;font-weight:660;letter-spacing:-.02em;margin-top:6px;line-height:1.15}
.stat-v.sm{font-size:1.25rem}
.stat-d{font-size:.78rem;margin-top:5px;display:flex;align-items:center;gap:5px;color:var(--ink-2);flex-wrap:wrap}
.stat-d .bar{flex:1 1 100%;min-width:90px;margin-top:2px}
.hero{background:linear-gradient(180deg,var(--surface),var(--surface));border:1px solid var(--border)}
.hero .stat-v{font-size:2.3rem}
.dot{width:9px;height:9px;border-radius:3px;flex:0 0 auto;display:inline-block}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:999px;font-size:.74rem;font-weight:600;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--border)}
.badge.good{color:var(--good);border-color:rgba(12,163,12,.35);background:rgba(12,163,12,.10)}
.badge.warn{color:#8a6100;border-color:rgba(250,178,25,.4);background:rgba(250,178,25,.14)}
:root[data-theme="dark"] .badge.warn{color:var(--warn)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge.warn{color:var(--warn)}}
.badge.crit{color:var(--crit);border-color:rgba(208,59,59,.35);background:rgba(208,59,59,.10)}
.badge.info{color:var(--accent);border-color:rgba(42,120,214,.3);background:var(--accent-soft)}
/* progress */
.bar{height:8px;border-radius:999px;background:var(--surface-3);overflow:hidden;position:relative}
.bar>span{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .3s}
/* ============================== TABLES ============================== */
.tw{overflow-x:auto;margin:0 -18px;padding:0 18px}
table{width:100%;border-collapse:collapse;font-size:.86rem;min-width:420px}
thead th{
  text-align:left;font-size:.73rem;font-weight:620;color:var(--muted);text-transform:uppercase;
  letter-spacing:.04em;padding:0 10px 8px;white-space:nowrap;border-bottom:1px solid var(--border);
}
tbody td{padding:10px;border-bottom:1px solid var(--grid);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--surface-2)}
td.r,th.r{text-align:right}
td.actions{width:1%;white-space:nowrap;text-align:right}
td.actions .btn{opacity:.55}
tr:hover td.actions .btn{opacity:1}
.t-main{font-weight:560}
.t-sub{font-size:.76rem;color:var(--muted);margin-top:2px}
.empty{text-align:center;padding:30px 18px;color:var(--muted);font-size:.87rem}
.empty svg{width:34px;height:34px;opacity:.35;margin-bottom:8px}
/* ============================== CHARTS ============================== */
.chart-wrap{position:relative;width:100%}
.chart-wrap svg{display:block;width:100%;overflow:visible}
.tip{
  position:absolute;pointer-events:none;opacity:0;transform:translate(-50%,-100%);
  background:var(--surface);border:1px solid var(--border-strong);border-radius:10px;
  box-shadow:0 6px 20px rgba(0,0,0,.16);padding:8px 10px;font-size:.79rem;
  white-space:nowrap;z-index:12;transition:opacity .1s;
}
.tip b{font-weight:640}
.tip .tip-r{display:flex;align-items:center;gap:7px;margin-top:3px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:12px;font-size:.8rem;color:var(--ink-2)}
.legend .li{display:flex;align-items:center;gap:7px}
.legend .lv{color:var(--muted);font-variant-numeric:tabular-nums}
.don-c{text-anchor:middle}
.hitrect{fill:transparent;cursor:crosshair}
.mark-hover{opacity:.82}
/* ============================== MODAL ============================== */
.overlay{
  position:fixed;inset:0;background:rgba(11,11,11,.45);backdrop-filter:blur(3px);
  z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;
  animation:fade .14s ease-out;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
.modal{
  background:var(--surface);border:1px solid var(--border);border-radius:18px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);width:min(560px,100%);max-height:88dvh;
  display:flex;flex-direction:column;animation:pop .16s ease-out;
}
.modal.wide{width:min(880px,100%)}
.modal-h{padding:16px 20px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.modal-b{padding:18px 20px;overflow-y:auto}
.modal-f{padding:12px 20px 16px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.field{margin-bottom:13px}
.field label{display:block;margin-bottom:5px}
.field .hint{font-size:.75rem;color:var(--muted);margin-top:4px}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.check{display:flex;align-items:center;gap:9px;font-size:.88rem;color:var(--ink)}
/* ============================== TOAST ============================== */
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  background:var(--ink);color:var(--page);padding:10px 16px;border-radius:11px;font-size:.85rem;
  box-shadow:0 8px 24px rgba(0,0,0,.25);animation:pop .16s ease-out;max-width:88vw;
}
.toast.err{background:var(--crit);color:#fff}
/* ============================== MISC ============================== */
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--grid);font-size:.86rem}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink-2)}
.kv .v{font-weight:600;font-variant-numeric:tabular-nums}
.note{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;font-size:.82rem;color:var(--ink-2)}
.note b{color:var(--ink)}
pre.sql{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r);padding:12px;overflow-x:auto;font-size:.75rem;line-height:1.5;margin:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-2)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync-dot.on{background:var(--good)}
.sync-dot.err{background:var(--crit)}
/* ============================== RESPONSIVE ============================== */
@media (max-width:1100px){
  .g-side,.g-side2,.g-wide,.g-half{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:980px){
  .g-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:820px){
  .sidebar{display:none}
  .app{display:block}
  .topbar{padding:10px 14px;flex-wrap:wrap;gap:8px}
  .topbar h1{font-size:1.02rem}
  .topbar>div:first-child{flex:1 1 100%;min-width:0}
  .topbar-actions{margin-left:0;width:100%;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .topbar-actions::-webkit-scrollbar{display:none}
  .topbar-actions .seg{flex:0 0 auto}
  .container{padding:14px 14px 96px}
  .card{padding:14px;border-radius:14px}
  .tw{margin:0 -14px;padding:0 14px}
  .g-2,.g-3,.g-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g-auto{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .span-2{grid-column:span 2}
  .stat-v{font-size:1.32rem}
  .hero .stat-v{font-size:1.9rem}
  .fgrid{grid-template-columns:1fr}
  .modal{width:100%;max-height:92dvh;border-radius:18px 18px 0 0;margin-top:auto;animation:sheet .2s ease-out}
  @keyframes sheet{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
  .overlay{padding:0;align-items:flex-end}
  #toast{bottom:calc(74px + env(safe-area-inset-bottom))}
  .tabbar{
    display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;
    background:var(--surface);border-top:1px solid var(--border);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;
  }
  .tabbar button{
    flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:5px 2px;border-radius:10px;color:var(--muted);font-size:.65rem;font-weight:560;cursor:pointer;
  }
  .tabbar button svg{width:21px;height:21px}
  .tabbar button.on{color:var(--accent)}
}
@media (max-width:430px){
  .g-2{grid-template-columns:1fr}
  .stat-v{font-size:1.15rem}
  .hero .stat-v{font-size:1.7rem}
  .legend{gap:5px 12px;font-size:.76rem}
}
@media print{.sidebar,.tabbar,.topbar-actions{display:none}.card{break-inside:avoid}}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main>
    <header class="topbar" id="topbar"></header>
    <div class="container" id="view"></div>
  </main>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div id="modal-root"></div>
<div id="toast"></div>
<script>
"use strict";
/* ==================================================================
   PATRIMOINE — application autonome (aucune dépendance externe)
   Données : localStorage + export/import JSON — sync Supabase optionnelle
   ================================================================== */

/* ---------------------------- UTILITAIRES ---------------------------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const nb = v => { const n = typeof v === "number" ? v : parseFloat(String(v ?? "").replace(/\s/g, "").replace(",", ".")); return Number.isFinite(n) ? n : 0; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const nfEur0 = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
const nfEur2 = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", minimumFractionDigits: 2, maximumFractionDigits: 2 });
const nfNum = new Intl.NumberFormat("fr-FR", { maximumFractionDigits: 2 });
const eur = (v, d = 0) => (d ? nfEur2 : nfEur0).format(Number.isFinite(v) ? v : 0);
const eurC = (v, d = 0) => (v > 0 ? "+" : "") + eur(v, d);
const pct = (v, d = 1) => (Number.isFinite(v) ? (v > 0 ? "+" : "") + v.toFixed(d).replace(".", ",") : "—") + " %";

/* ---------------------------- CALCULS PATRIMOINE ---------------------------- */
const accClass = t => (ACC_TYPES.find(a => a.v === t) || { cls: "autres" }).cls;
const holdValue = h => nb(h.qty) * nb(h.price);
const holdCost = h => nb(h.qty) * nb(h.pru);
const accHoldings = id => P().holdings.filter(h => h.accountId === id);
const accTotal = a => nb(a.balance) + accHoldings(a.id).reduce((s, h) => s + holdValue(h), 0);

function computePersonal() {
  const p = P();
  const byClass = Object.fromEntries(CLASSES.map(c => [c.k, 0]));
  p.accounts.forEach(a => { byClass[accClass(a.type)] += accTotal(a); });
  const immo = p.properties.reduce((s, x) => s + nb(x.value), 0);
  byClass.immobilier += immo;
  let otherAssets = 0, otherDebts = 0;
  p.others.forEach(o => { if (o.kind === "debt") otherDebts += nb(o.value); else otherAssets += nb(o.value); });
  byClass.autres += otherAssets;
  const loans = p.loans.reduce((s, l) => s + nb(l.remaining), 0);
  const gross = CLASSES.reduce((s, c) => s + byClass[c.k], 0);
  const debts = loans + otherDebts;
  const invested = p.holdings.reduce((s, h) => s + holdCost(h), 0);
  const market = p.holdings.reduce((s, h) => s + holdValue(h), 0);
  return {
    byClass, gross, debts, loans, otherDebts, net: gross - debts,
    immo, invested, market, pv: market - invested,
    pvPct: invested > 0 ? ((market - invested) / invested) * 100 : 0,
    rentMonthly: p.properties.reduce((s, x) => s + nb(x.rentMonthly) - nb(x.chargesMonthly), 0),
    loanPayment: p.loans.reduce((s, l) => s + nb(l.payment), 0),
  };
}
function monthFlows(txs, ym) {
  let inc = 0, exp = 0;
  txs.forEach(t => { if (ymOf(t.date) !== ym) return; const a = nb(t.amount); if (a >= 0) inc += a; else exp += -a; });
  return { inc, exp, net: inc - exp, rate: inc > 0 ? ((inc - exp) / inc) * 100 : 0 };
}
function byCategory(txs, ym, sign = -1) {
  const m = {};
  txs.forEach(t => {
    if (ym && ymOf(t.date) !== ym) return;
    const a = nb(t.amount);
    if (sign < 0 ? a >= 0 : a < 0) return;
    const c = t.category || "Non catégorisé";
    m[c] = (m[c] || 0) + Math.abs(a);
  });
  return Object.entries(m).map(([label, value]) => ({ label, value })).sort((a, b) => b.value - a.value);
}

function touchSnapshot() {

  const i = snaps.findIndex(s => s.ym === ym);
  if (i >= 0) snaps[i] = rec; else snaps.push(rec);
  snaps.sort((a, b) => a.ym.localeCompare(b.ym));
  const c = computeCompany(), cs = C().snapshots;
  const crec = { ym, cash: Math.round(c.cash), assets: Math.round(c.total) };
  const j = cs.findIndex(s => s.ym === ym);
  if (j >= 0) cs[j] = crec; else cs.push(crec);
  cs.sort((a, b) => a.ym.localeCompare(b.ym));
}
function netSeries(n = 12) {

  const months = ymRange(end, n);

  return months.map(ym => {

/* ---------------------------- CALCULS SARL ---------------------------- */
function amortOf(fa) {
  const years = Math.max(1, nb(fa.years) || 1), amount = nb(fa.amount);
  const annual = amount / years;
  const start = new Date(fa.date || todayISO());
  const elapsedY = Math.max(0, (new Date() - start) / (365.25 * 86400000));
  const cum = Math.min(amount, annual * elapsedY);
  return { annual, cum, vnc: Math.max(0, amount - cum), progress: amount ? cum / amount : 0 };
}
const invoiceTTC = i => nb(i.amountHT) * (1 + nb(i.vatRate) / 100);
function invoiceStatus(i) {
  if (i.status === "payee") return { k: "payee", l: "Payée", cls: "good" };
  if (i.status === "brouillon") return { k: "brouillon", l: "Brouillon", cls: "" };
  if (i.dateDue && i.dateDue < todayISO()) return { k: "retard", l: "En retard", cls: "crit" };
  return { k: "envoyee", l: "En attente", cls: "warn" };
}
function computeCompany() {
  const c = C();
  const cash = c.accounts.reduce((s, a) => s + nb(a.balance), 0);
  const inv = c.investments.reduce((s, i) => s + nb(i.value), 0);
  const fa = c.fixedAssets.reduce((s, f) => s + amortOf(f).vnc, 0);
  const faGross = c.fixedAssets.reduce((s, f) => s + nb(f.amount), 0);
  const amortAnnual = c.fixedAssets.reduce((s, f) => s + amortOf(f).annual, 0);
  const unpaid = c.invoices.filter(i => invoiceStatus(i).k === "envoyee" || invoiceStatus(i).k === "retard");
  const receivable = unpaid.reduce((s, i) => s + invoiceTTC(i), 0);
  const late = c.invoices.filter(i => invoiceStatus(i).k === "retard");
  const ccaBal = c.cca.reduce((s, m) => s + nb(m.amount), 0);
  const invCost = c.investments.reduce((s, i) => s + nb(i.cost || 0), 0);
  return {
    cash, inv, fa, faGross, amortAnnual, receivable, lateCount: late.length,
    lateAmount: late.reduce((s, i) => s + invoiceTTC(i), 0),
    ccaBal, total: cash + inv + fa, invCost, invPv: inv - invCost,
  };
}
function vatPeriods(back = 6) {
  const c = C(), per = c.vatPeriod === "mensuel" ? 1 : 3;
  const now = new Date(); const list = [];
  for (let k = back - 1; k >= 0; k--) {
    const end = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() - k * per, 1));
    const startM = new Date(Date.UTC(end.getUTCFullYear(), end.getUTCMonth() - (per - 1), 1));
    const months = [];
    for (let i = 0; i < per; i++) months.push(new Date(Date.UTC(startM.getUTCFullYear(), startM.getUTCMonth() + i, 1)).toISOString().slice(0, 7));
    list.push({
      key: months[0] + (per > 1 ? "→" + months[months.length - 1] : ""),
      label: per === 1 ? ymLabel(months[0]) : `${ymShort(months[0])} – ${ymShort(months[months.length - 1])}`,
      months,
    });
  }
  return list;
}
function vatOf(months) {
  const c = C(), onCash = c.vatRegime === "encaissements";
  let collected = 0, deductible = 0;
  c.invoices.forEach(i => {
    const st = invoiceStatus(i); if (st.k === "brouillon") return;
    const ref = onCash ? (i.datePaid || "") : (i.dateIssue || "");
    if (onCash && st.k !== "payee") return;
    if (!months.includes(ymOf(ref))) return;
    collected += nb(i.amountHT) * nb(i.vatRate) / 100;
  });
  c.transactions.forEach(t => {
    if (!months.includes(ymOf(t.date))) return;
    const a = nb(t.amount);
    if (a < 0 && t.deductible !== false && nb(t.vatRate) > 0) deductible += (-a) - (-a) / (1 + nb(t.vatRate) / 100);
    if (a > 0 && nb(t.vatRate) > 0 && t.countVat) collected += a - a / (1 + nb(t.vatRate) / 100);
  });
  return { collected, deductible, due: collected - deductible };
}

/* ---- Formulaire générique ---- */
function formModal({ title, fields, values = {}, onSubmit, wide = false, submitLabel = "Enregistrer", extra = "" }) {
  const html = fields.map(f => {
    if (f.type === "hidden") return "";
    const v = values[f.key] ?? f.def ?? "";
    const req = f.required ? " required" : "";
    let input;
    if (f.type === "select") {
      input = `<select name="${f.key}"${req}>${(typeof f.options === "function" ? f.options() : f.options).map(o => {
        const ov = typeof o === "string" ? o : o.v, ol = typeof o === "string" ? o : o.l;
        return `<option value="${esc(ov)}"${String(ov) === String(v) ? " selected" : ""}>${esc(ol)}</option>`;
      }).join("")}</select>`;
    } else if (f.type === "textarea") {
      input = `<textarea name="${f.key}" rows="2" placeholder="${esc(f.ph || "")}">${esc(v)}</textarea>`;
    } else if (f.type === "check") {
      input = `<label class="check"><input type="checkbox" name="${f.key}"${v ? " checked" : ""}> ${esc(f.label)}</label>`;
      return `<div class="field">${input}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ""}</div>`;
    } else {
      const step = f.type === "number" ? ` step="${f.step || "any"}"` : "";
      input = `<input type="${f.type || "text"}" name="${f.key}" value="${esc(v)}"${step}${req} placeholder="${esc(f.ph || "")}" ${f.type === "number" ? 'inputmode="decimal"' : ""}>`;
    }
    return `<div class="field"${f.half ? ' style="grid-column:auto"' : ""}><label for="${f.key}">${esc(f.label)}${f.required ? " *" : ""}</label>${input}${f.hint ? `<div class="hint">${esc(f.hint)}</div>` : ""}</div>`;
  });
  const body = `<form id="mf">${extra}<div class="fgrid">${html.join("")}</div></form>`;
  openModal({
    title, body, wide,
    footer: `<button class="btn" data-close="1">Annuler</button><button class="btn btn-primary" type="submit" form="mf">${esc(submitLabel)}</button>`,
    onMount: r => {
      r.querySelector("#mf").addEventListener("submit", e => {
        e.preventDefault();
        const fd = new FormData(e.target), out = { ...values };
        fields.forEach(f => {
          if (f.type === "check") out[f.key] = fd.get(f.key) === "on";
          else if (f.type === "number") out[f.key] = nb(fd.get(f.key));
          else out[f.key] = (fd.get(f.key) ?? "").toString().trim();
        });
        closeModal(); onSubmit(out);
      });
    },
  });
}

function tableHtml(cols, rows, opts = {}) {
  if (!rows.length) return emptyHtml(opts.empty || "Aucune donnée pour le moment.", opts.emptyAction);
  return `<div class="tw"><table><thead><tr>${cols.map(c => `<th class="${c.r ? "r" : ""}">${esc(c.l)}</th>`).join("")}${opts.actions ? '<th class="r"></th>' : ""}</tr></thead>
  <tbody>${rows.map(r => `<tr>${cols.map(c => `<td class="${c.r ? "r num" : ""}">${c.render(r)}</td>`).join("")}${opts.actions ? `<td class="actions">
    <button class="btn btn-sm btn-ghost btn-icon" data-act="edit" data-id="${r.id}" aria-label="Modifier">${ico("edit")}</button>
    <button class="btn btn-sm btn-ghost btn-icon" data-act="del" data-id="${r.id}" aria-label="Supprimer">${ico("trash")}</button></td>` : ""}</tr>`).join("")}</tbody></table></div>`;
}
const emptyHtml = (msg, action) => `<div class="empty">${ico("empty")}<div>${esc(msg)}</div>${action ? `<div style="margin-top:12px">${action}</div>` : ""}</div>`;
const statHtml = (label, value, delta, cls = "") => `<div class="stat ${cls}"><div class="stat-l">${label}</div><div class="stat-v num">${value}</div>${delta ? `<div class="stat-d">${delta}</div>` : ""}</div>`;
const money = (v, d = 0) => state.settings.hideAmounts ? "••••" : eur(v, d);
const moneyC = (v, d = 0) => state.settings.hideAmounts ? "••••" : eurC(v, d);

/* ==================================================================
   GRAPHIQUES (SVG maison, sans librairie)
   ================================================================== */
const CHARTS = new Map();
function chart(spec) {
  const id = "c" + uid();
  CHARTS.set(id, spec);
  return `<div class="chart-wrap" data-cid="${id}" style="min-height:${spec.height || 210}px"></div>`;
}
function hydrateCharts() {
  $$(".chart-wrap[data-cid]").forEach(el => {
    const spec = CHARTS.get(el.dataset.cid); if (!spec) return;
    const draw = () => {
      const w = Math.max(240, el.clientWidth || el.parentElement.clientWidth || 320);
      if (spec.type === "line") drawLine(el, spec, w);
      else if (spec.type === "bars") drawBars(el, spec, w);
      else if (spec.type === "donut") drawDonut(el, spec, w);
    };
    draw();
    if (window.ResizeObserver && !el._ro) {
      let t; el._ro = new ResizeObserver(() => { clearTimeout(t); t = setTimeout(draw, 120); });
      el._ro.observe(el);
    }
  });
}
const tipEl = el => { let t = el.querySelector(".tip"); if (!t) { t = document.createElement("div"); t.className = "tip"; el.appendChild(t); } return t; };
function showTip(el, x, y, html) { const t = tipEl(el); t.innerHTML = html; t.style.opacity = "1"; const w = t.offsetWidth; t.style.left = clamp(x, w / 2 + 4, el.clientWidth - w / 2 - 4) + "px"; t.style.top = Math.max(30, y - 10) + "px"; }
const hideTip = el => { const t = el.querySelector(".tip"); if (t) t.style.opacity = "0"; };

/* ---- Courbe / aire ---- */
function drawLine(el, spec, W) {
  const H = spec.height || 210, mL = 52, mR = 12, mT = 12, mB = 26;
  const iw = W - mL - mR, ih = H - mT - mB;
  const series = spec.series.filter(s => s.points.some(p => p.y !== null));
  const labels = (spec.series[0] || { points: [] }).points.map(p => p.x);
  const vals = series.flatMap(s => s.points.map(p => p.y)).filter(v => v !== null && Number.isFinite(v));
  if (!vals.length) { el.innerHTML = emptyHtml(spec.empty || "Pas encore de données."); return; }
  let min = Math.min(...vals), max = Math.max(...vals);
  if (spec.zero || min > 0 && (max - min) / (max || 1) > .6) min = Math.min(0, min);
  if (min === max) { max = max + Math.abs(max || 1) * .1; min = min - Math.abs(min || 1) * .1; }
  const pad = (max - min) * .12; max += pad; min -= (min < 0 ? pad : Math.min(pad, Math.abs(min)));
  const n = labels.length;
  const X = i => mL + (n <= 1 ? iw / 2 : (i * iw) / (n - 1));
  const Y = v => mT + ih - ((v - min) / (max - min)) * ih;
  const ticks = 4, gy = [];
  for (let i = 0; i <= ticks; i++) gy.push(min + ((max - min) * i) / ticks);
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(spec.aria || "Graphique d'évolution")}">`;
  gy.forEach(v => { const y = Y(v); svg += `<line x1="${mL}" y1="${y.toFixed(1)}" x2="${W - mR}" y2="${y.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/><text x="${mL - 8}" y="${(y + 3.5).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--muted)">${eurShort(v)}</text>`; });
  if (min < 0 && max > 0) svg += `<line x1="${mL}" y1="${Y(0)}" x2="${W - mR}" y2="${Y(0)}" stroke="var(--axis)" stroke-width="1.5"/>`;
  const every = Math.max(1, Math.ceil(n / Math.max(2, Math.floor(iw / 62))));
  labels.forEach((l, i) => { if (i % every && i !== n - 1) return; svg += `<text x="${X(i).toFixed(1)}" y="${H - 7}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${esc(spec.xfmt ? spec.xfmt(l) : l)}</text>`; });
  series.forEach((s, si) => {
    const pts = s.points.map((p, i) => (p.y === null ? null : [X(i), Y(p.y)])).filter(Boolean);
    if (!pts.length) return;
    const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
    if (spec.area && series.length === 1) {
      svg += `<defs><linearGradient id="g${si}${el.dataset.cid}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${s.color}" stop-opacity=".22"/><stop offset="100%" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs>
        <path d="${d} L ${pts[pts.length - 1][0].toFixed(1)} ${(mT + ih).toFixed(1)} L ${pts[0][0].toFixed(1)} ${(mT + ih).toFixed(1)} Z" fill="url(#g${si}${el.dataset.cid})"/>`;
    }
    svg += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
    if (pts.length <= 14) pts.forEach(p => { svg += `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`; });
  });
  svg += `<g class="hov" opacity="0"><line y1="${mT}" y2="${mT + ih}" stroke="var(--axis)" stroke-width="1.5" stroke-dasharray="3 3"/>${series.map(s => `<circle r="5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`).join("")}</g>`;
  svg += `<rect class="hitrect" x="${mL}" y="${mT}" width="${iw}" height="${ih}"/></svg>`;
  el.innerHTML = svg + (spec.legend === false || series.length < 2 ? "" : legendHtml(series.map(s => ({ label: s.name, color: s.color }))));
  const hit = el.querySelector(".hitrect"), hov = el.querySelector(".hov");
  const move = e => {
    const r = el.querySelector("svg").getBoundingClientRect();
    const px = ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) * (W / r.width);
    const i = clamp(Math.round(((px - mL) / (iw || 1)) * (n - 1)), 0, n - 1);
    const x = X(i);
    hov.setAttribute("opacity", "1");
    hov.querySelector("line").setAttribute("x1", x); hov.querySelector("line").setAttribute("x2", x);
    const circles = [...hov.querySelectorAll("circle")];
    let rows = "";
    series.forEach((s, si) => {
      const p = s.points[i];
      const c = circles[si];
      if (!p || p.y === null) { c.setAttribute("opacity", "0"); return; }
      c.setAttribute("opacity", "1"); c.setAttribute("cx", x); c.setAttribute("cy", Y(p.y));
      rows += `<div class="tip-r"><span class="dot" style="background:${s.color}"></span>${series.length > 1 ? esc(s.name) + " " : ""}<b>${spec.fmt ? spec.fmt(p.y) : money(p.y)}</b></div>`;
    });
    showTip(el, (x * (r.width / W)), (mT * (r.height / H)) + 4, `<b>${esc(spec.xfmt ? spec.xfmt(labels[i]) : labels[i])}</b>${rows}`);
  };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => { hov.setAttribute("opacity", "0"); hideTip(el); });
}
/* ---- Barres (simples ou empilées) ---- */
function drawBars(el, spec, W) {
  const H = spec.height || 210, mL = 52, mR = 12, mT = 12, mB = 26;
  const iw = W - mL - mR, ih = H - mT - mB;
  const groups = spec.groups;
  if (!groups.length || !groups.some(g => g.values.some(v => v.value))) { el.innerHTML = emptyHtml(spec.empty || "Pas encore de données."); return; }
  const totals = groups.map(g => g.values.reduce((s, v) => s + Math.max(0, v.value), 0));
  const negTot = groups.map(g => g.values.reduce((s, v) => s + Math.min(0, v.value), 0));
  let max = Math.max(...totals, 0), min = Math.min(...negTot, 0);
  if (!spec.stacked) { max = Math.max(...groups.flatMap(g => g.values.map(v => v.value)), 0); min = Math.min(...groups.flatMap(g => g.values.map(v => v.value)), 0); }
  max = max * 1.12 || 1; min = min * 1.12;
  const Y = v => mT + ih - ((v - min) / (max - min)) * ih, base = Y(0);
  const gw = iw / groups.length, inner = Math.min(46, gw * .62);
  const ticks = 4; let svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(spec.aria || "Graphique en barres")}">`;
  for (let i = 0; i <= ticks; i++) { const v = min + ((max - min) * i) / ticks, y = Y(v); svg += `<line x1="${mL}" y1="${y.toFixed(1)}" x2="${W - mR}" y2="${y.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/><text x="${mL - 8}" y="${(y + 3.5).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--muted)">${eurShort(v)}</text>`; }
  svg += `<line x1="${mL}" y1="${base.toFixed(1)}" x2="${W - mR}" y2="${base.toFixed(1)}" stroke="var(--axis)" stroke-width="1.5"/>`;
  const nSeries = spec.stacked ? 1 : (groups[0]?.values.length || 1);
  const every = Math.max(1, Math.ceil(groups.length / Math.max(2, Math.floor(iw / 58))));
  groups.forEach((g, gi) => {
    const cx = mL + gw * gi + gw / 2;
    if (!(gi % every) || gi === groups.length - 1) svg += `<text x="${cx.toFixed(1)}" y="${H - 7}" text-anchor="middle" font-size="10.5" fill="var(--muted)">${esc(spec.xfmt ? spec.xfmt(g.label) : g.label)}</text>`;
    if (spec.stacked) {
      let accP = 0, accN = 0;
      g.values.forEach((v, vi) => {
        if (!v.value) return;
        const from = v.value > 0 ? accP : accN, to = from + v.value;
        if (v.value > 0) accP = to; else accN = to;
        const y1 = Y(to), y0 = Y(from), h = Math.abs(y0 - y1);
        const top = v.value > 0 ? y1 : y0;
        svg += barPath(cx - inner / 2, top, inner, Math.max(1, h - 2), v.value > 0 ? (accP === to ? 4 : 0) : 0, v.color, `${gi}-${vi}`);
      });
    } else {
      const bw = (inner - 2 * (nSeries - 1)) / nSeries;
      g.values.forEach((v, vi) => {
        const x = cx - inner / 2 + vi * (bw + 2);
        const y = v.value >= 0 ? Y(v.value) : base, h = Math.abs(Y(v.value) - base);
        svg += barPath(x, y, bw, Math.max(1, h), 4, v.color, `${gi}-${vi}`);
      });
    }
  });
  svg += `</svg>`;
  const legItems = (groups[0]?.values || []).map(v => ({ label: v.name, color: v.color }));
  el.innerHTML = svg + (spec.legend === false || legItems.length < 2 ? "" : legendHtml(legItems));
  el.querySelectorAll("path[data-k]").forEach(p => {
    p.addEventListener("pointerenter", e => {
      p.classList.add("mark-hover");
      const [gi, vi] = p.dataset.k.split("-").map(Number), g = groups[gi], v = g.values[vi];
      const r = el.querySelector("svg").getBoundingClientRect(), box = p.getBoundingClientRect();
      showTip(el, box.left - r.left + box.width / 2, box.top - r.top, `<b>${esc(spec.xfmt ? spec.xfmt(g.label) : g.label)}</b><div class="tip-r"><span class="dot" style="background:${v.color}"></span>${esc(v.name)} <b>${spec.fmt ? spec.fmt(v.value) : money(v.value)}</b></div>`);
    });
    p.addEventListener("pointerleave", () => { p.classList.remove("mark-hover"); hideTip(el); });
  });
}
function barPath(x, y, w, h, r, fill, key) {
  r = Math.min(r, w / 2, h);
  return `<path data-k="${key}" fill="${fill}" d="M${x} ${y + h} L${x} ${y + r} Q${x} ${y} ${x + r} ${y} L${x + w - r} ${y} Q${x + w} ${y} ${x + w} ${y + r} L${x + w} ${y + h} Z"/>`;
}
/* ---- Donut ---- */
function drawDonut(el, spec, W) {
  const items = spec.items.filter(i => i.value > 0);
  const H = spec.height || 210;
  if (!items.length) { el.innerHTML = emptyHtml(spec.empty || "Aucune valeur à répartir."); return; }
  const total = items.reduce((s, i) => s + i.value, 0);
  const size = Math.min(W, H), cx = W / 2, cy = H / 2, R = size / 2 - 6, r = R * .62;
  const gap = items.length > 1 ? 2 : 0;
  let a0 = -Math.PI / 2, svg = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(spec.aria || "Répartition")}">`;
  items.forEach((it, i) => {
    const ang = (it.value / total) * Math.PI * 2;
    const gapA = Math.min(gap / R, ang * .35);
    const s = a0 + gapA / 2, e = a0 + ang - gapA / 2;
    svg += `<path data-i="${i}" fill="${it.color}" d="${arc(cx, cy, R, r, s, e)}"/>`;
    a0 += ang;
  });
  svg += `<text class="don-c" x="${cx}" y="${cy - 2}" font-size="12" fill="var(--muted)">${esc(spec.centerLabel || "Total")}</text>
    <text class="don-c" x="${cx}" y="${cy + 20}" font-size="17" font-weight="640" fill="var(--ink)">${esc(spec.centerValue || money(total))}</text></svg>`;
  el.innerHTML = svg + legendHtml(items.map(i => ({ label: i.label, color: i.color, value: `${money(i.value)} · ${((i.value / total) * 100).toFixed(0)} %` })));
  el.querySelectorAll("path[data-i]").forEach(p => {
    p.addEventListener("pointerenter", e => {
      p.classList.add("mark-hover");
      const it = items[+p.dataset.i], rct = el.getBoundingClientRect(), b = p.getBoundingClientRect();
      showTip(el, b.left - rct.left + b.width / 2, b.top - rct.top + 8, `<b>${esc(it.label)}</b><div class="tip-r"><span class="dot" style="background:${it.color}"></span><b>${money(it.value)}</b> · ${((it.value / total) * 100).toFixed(1).replace(".", ",")} %</div>`);
    });
    p.addEventListener("pointerleave", () => { p.classList.remove("mark-hover"); hideTip(el); });
  });
}
function arc(cx, cy, R, r, s, e) {
  const p = (rad, a) => [cx + rad * Math.cos(a), cy + rad * Math.sin(a)];
  const big = e - s > Math.PI ? 1 : 0;
  const [x1, y1] = p(R, s), [x2, y2] = p(R, e), [x3, y3] = p(r, e), [x4, y4] = p(r, s);
  return `M${x1.toFixed(2)} ${y1.toFixed(2)} A${R} ${R} 0 ${big} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} L${x3.toFixed(2)} ${y3.toFixed(2)} A${r} ${r} 0 ${big} 0 ${x4.toFixed(2)} ${y4.toFixed(2)} Z`;
}
const legendHtml = items => `<div class="legend">${items.map(i => `<span class="li"><span class="dot" style="background:${i.color}"></span>${esc(i.label)}${i.value ? ` <span class="lv">${i.value}</span>` : ""}</span>`).join("")}</div>`;
/* barres horizontales HTML (catégories) */
function hbars(items, opts = {}) {
  if (!items.length) return emptyHtml(opts.empty || "Aucune donnée.");
  const max = Math.max(...items.map(i => i.value)) || 1;
  return `<div style="display:flex;flex-direction:column;gap:11px">${items.map((i, k) => `
    <div><div class="row" style="justify-content:space-between;gap:8px;margin-bottom:5px">
      <span style="font-size:.85rem;display:flex;align-items:center;gap:7px;min-width:0"><span class="dot" style="background:${i.color || SERIES[k % 8]}"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(i.label)}</span></span>
      <span class="num" style="font-size:.85rem;font-weight:600;white-space:nowrap">${money(i.value)}${i.sub ? ` <span class="muted" style="font-weight:400">${esc(i.sub)}</span>` : ""}</span></div>
    <div class="bar"><span style="width:${((i.value / max) * 100).toFixed(1)}%;background:${i.color || SERIES[k % 8]}"></span></div></div>`).join("")}</div>`;
}

const listAt = path => { const [a, b] = path.split("."); return state[a][b]; };
const ED = {};
function editItem(path, id) {
  const spec = ED[path]; if (!spec) return;
  const list = listAt(path), item = id ? list.find(x => x.id === id) : {};
  formModal({
    title: (id ? "Modifier — " : "Ajouter — ") + spec.title,
    fields: typeof spec.fields === "function" ? spec.fields(item) : spec.fields,
    values: item, wide: spec.wide,
    onSubmit(v) {
      if (spec.clean) v = spec.clean(v) || v;
      if (id) Object.assign(item, v); else { v.id = uid(); list.push(v); }
      if (spec.after) spec.after(v);
      save(); render(); toast(id ? "Modification enregistrée" : "Ajouté");
    },
  });
}
function delItem(path, id) {
  const list = listAt(path), i = list.findIndex(x => x.id === id); if (i < 0) return;
  confirmDialog("Confirmer la suppression", (ED[path] && ED[path].delMsg) || "Cette entrée sera définitivement supprimée.", () => {
    const [rm] = list.splice(i, 1);
    if (ED[path] && ED[path].onDelete) ED[path].onDelete(rm);
    save(); render(); toast("Supprimé");
  });
}
const addBtn = (path, label = "Ajouter") => `<button class="btn btn-primary btn-sm" data-add="${path}">${ico("plus")}${esc(label)}</button>`;
const wrapList = (path, html) => `<div data-list="${path}">${html}</div>`;

function viewDashboard() {
  const t = computePersonal(), c = computeCompany();
  const snaps = P().snapshots;
  const prev = snaps.filter(s => s.ym < curYM()).slice(-1)[0];
  const delta = prev ? t.net - prev.net : null;
  const deltaPct = prev && prev.net ? (delta / Math.abs(prev.net)) * 100 : null;
  const f = monthFlows(P().transactions, curYM());
  const classItems = CLASSES.map(cl => ({ label: cl.l, value: t.byClass[cl.k], color: cl.c })).filter(i => i.value > 0);

function goalCurrent(g) {
  if (g.accountIds && g.accountIds.length) return P().accounts.filter(a => g.accountIds.includes(a.id)).reduce((s, a) => s + accTotal(a), 0);
  return nb(g.current);
}
function goalRow(g) {
  const cur = goalCurrent(g), tgt = nb(g.target), p = tgt > 0 ? clamp((cur / tgt) * 100, 0, 100) : 0;
  const left = tgt - cur, days = g.deadline ? daysBetween(todayISO(), g.deadline) : null;
  const perMonth = days && days > 0 && left > 0 ? left / (days / 30.44) : null;
  return `<div>
    <div class="row" style="justify-content:space-between;gap:8px;margin-bottom:6px">
      <span style="font-weight:560">${esc(g.name)}</span>
      <span class="num" style="font-size:.85rem"><b>${money(cur)}</b> <span class="muted">/ ${money(tgt)}</span></span>
    </div>
    <div class="bar"><span style="width:${p}%;background:${p >= 100 ? "var(--good)" : "var(--accent)"}"></span></div>
    <div class="row muted" style="justify-content:space-between;font-size:.76rem;margin-top:5px">
      <span>${p.toFixed(0)} %${g.deadline ? ` · échéance ${dLabel(g.deadline)}` : ""}</span>
      <span>${p >= 100 ? "Objectif atteint 🎉" : perMonth ? `${money(perMonth)} / mois requis` : left > 0 ? `${money(left)} restants` : ""}</span>
    </div></div>`;
}

  const budgets = state.personal.budgets || {};
  const budgetRows = Object.entries(budgets).filter(([, v]) => nb(v) > 0).map(([c, v]) => {

  topbar("Budget", `${esc(ymLabel(ym))} · ${list.length} opération(s)`,

  </div>
  <div class="grid g-wide">
    <div class="card"><div class="card-h"><h2>Revenus & dépenses — 12 mois</h2></div>
      ${chart({ type: "bars", height: 240, groups, xfmt: ymShort, fmt: v => money(Math.abs(v)), empty: "Saisissez ou importez vos premières opérations." })}
    </div>
    <div class="card"><div class="card-h"><h2>Dépenses par catégorie</h2><div class="right"><span class="badge">${esc(ymShort(ym))}</span></div></div>
      ${hbars(cats.slice(0, 9), { empty: "Aucune dépense ce mois-ci." })}

/* ==================================================================
   IMPORT CSV
   ================================================================== */
function parseCSV(text) {
  text = text.replace(/^﻿/, "");
  const firstLine = (text.split(/\r?\n/).find(l => l.trim()) || "");
  const cand = [";", ",", "\t", "|"];
  const sep = cand.map(s => [s, (firstLine.match(new RegExp("\\" + s, "g")) || []).length]).sort((a, b) => b[1] - a[1])[0][0];
  const rows = []; let row = [], cur = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true;
    else if (ch === sep) { row.push(cur); cur = ""; }
    else if (ch === "\n") { row.push(cur); rows.push(row); row = []; cur = ""; }
    else if (ch !== "\r") cur += ch;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== "")).map(r => r.map(c => c.trim()));
}
function parseDateFR(s) {
  s = String(s || "").trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if (m) { let y = m[3]; if (y.length === 2) y = (+y > 60 ? "19" : "20") + y; return `${y}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`; }
  const d = new Date(s); return isNaN(d) ? "" : d.toISOString().slice(0, 10);
}
function parseAmount(s) {
  s = String(s || "").replace(/[^\d,.\-+]/g, "").trim();
  if (!s) return 0;
  if (s.includes(",") && s.includes(".")) s = s.lastIndexOf(",") > s.lastIndexOf(".") ? s.replace(/\./g, "").replace(",", ".") : s.replace(/,/g, "");
  else if (s.includes(",")) s = s.replace(/\./g, "").replace(",", ".");
  const v = parseFloat(s); return Number.isFinite(v) ? v : 0;
}
function autoCategory(label, scope) {
  const l = String(label || "").toLowerCase();
  const rules = (state.settings.rules || []).filter(r => !r.scope || r.scope === scope);
  for (const r of rules) if (r.kw && l.includes(String(r.kw).toLowerCase())) return r.cat;
  return "";
}
function importCsvModal(scope) {
  const isPro = scope === "pro";
  openModal({
    title: `Importer un relevé CSV — ${isPro ? "SARL ALPEGA" : "personnel"}`, wide: true,
    body: `<div class="note" style="margin-bottom:14px">Exportez le relevé depuis votre banque au format CSV, puis chargez-le ici. Les colonnes sont détectées automatiquement — vous pouvez les corriger avant l'import.</div>
      <div class="field"><label>Fichier CSV</label><input type="file" id="csvf" accept=".csv,text/csv,text/plain"></div>
      <div id="csvcfg"></div>`,
    footer: `<button class="btn" data-close="1">Annuler</button><button class="btn btn-primary" id="csvgo" disabled>Importer</button>`,
    onMount: r => {
      let rows = [], head = [], hasHeader = true;
      r.querySelector("#csvf").onchange = e => {
        const file = e.target.files[0]; if (!file) return;
        const rd = new FileReader();
        rd.onload = () => {
          rows = parseCSV(rd.result);
          if (!rows.length) { toast("Fichier vide ou illisible", true); return; }
          head = rows[0];
          hasHeader = head.some(c => /date|libell|lib\.|montant|d[ée]bit|cr[ée]dit|description|op[ée]ration/i.test(c));
          const cols = head.map((h, i) => ({ v: String(i), l: (hasHeader ? h : "Colonne " + (i + 1)) || "Colonne " + (i + 1) }));
          const guess = re => { const i = head.findIndex(h => re.test(h)); return i < 0 ? "" : String(i); };
          const sample = rows.slice(hasHeader ? 1 : 0, (hasHeader ? 1 : 0) + 4);
          r.querySelector("#csvcfg").innerHTML = `
            <div class="fgrid">
              <div class="field"><label>Colonne date</label><select id="cd">${cols.map(c => `<option value="${c.v}"${c.v === (guess(/date/i) || "0") ? " selected" : ""}>${esc(c.l)}</option>`).join("")}</select></div>
              <div class="field"><label>Colonne libellé</label><select id="cl">${cols.map(c => `<option value="${c.v}"${c.v === (guess(/libell|description|op[ée]ration|nature/i) || "1") ? " selected" : ""}>${esc(c.l)}</option>`).join("")}</select></div>
              <div class="field"><label>Colonne montant</label><select id="ca"><option value="">— utiliser débit / crédit —</option>${cols.map(c => `<option value="${c.v}"${c.v === guess(/montant|amount/i) ? " selected" : ""}>${esc(c.l)}</option>`).join("")}</select></div>
              <div class="field"><label>Débit (dépenses)</label><select id="cdeb"><option value="">—</option>${cols.map(c => `<option value="${c.v}"${c.v === guess(/d[ée]bit/i) ? " selected" : ""}>${esc(c.l)}</option>`).join("")}</select></div>
              <div class="field"><label>Crédit (revenus)</label><select id="ccre"><option value="">—</option>${cols.map(c => `<option value="${c.v}"${c.v === guess(/cr[ée]dit/i) ? " selected" : ""}>${esc(c.l)}</option>`).join("")}</select></div>
              <div class="field"><label>Compte de destination</label><select id="cacc"><option value="">— aucun —</option>${(isPro ? C().accounts : P().accounts).map(a => `<option value="${a.id}">${esc(a.name)}</option>`).join("")}</select></div>
            </div>
            <div class="field"><label class="check"><input type="checkbox" id="chead"${hasHeader ? " checked" : ""}> La première ligne contient les en-têtes</label></div>
            <div class="field"><label class="check"><input type="checkbox" id="cinv"> Inverser le signe des montants</label></div>
            <h3 style="margin:14px 0 8px">Aperçu du fichier</h3>
            <div class="tw"><table><tbody>${sample.map(rw => `<tr>${rw.map(c => `<td style="font-size:.78rem">${esc(c.slice(0, 26))}</td>`).join("")}</tr>`).join("")}</tbody></table></div>
            <div class="note" style="margin-top:12px">${rows.length - (hasHeader ? 1 : 0)} ligne(s) détectée(s). Les catégories seront devinées grâce à vos règles de catégorisation (Réglages).</div>`;
          r.querySelector("#csvgo").disabled = false;
        };
        rd.readAsText(file, "utf-8");
      };
      r.querySelector("#csvgo").onclick = () => {
        const gv = id => r.querySelector(id).value;
        const skip = r.querySelector("#chead").checked ? 1 : 0, inv = r.querySelector("#cinv").checked ? -1 : 1;
        const ci = { d: +gv("#cd"), l: +gv("#cl"), a: gv("#ca"), deb: gv("#cdeb"), cre: gv("#ccre"), acc: gv("#cacc") };
        let n = 0;
        const target = isPro ? C().transactions : P().transactions;
        rows.slice(skip).forEach(rw => {
          const date = parseDateFR(rw[ci.d]); if (!date) return;
          let amount = 0;
          if (ci.a !== "") amount = parseAmount(rw[+ci.a]);
          else {
            const deb = ci.deb !== "" ? Math.abs(parseAmount(rw[+ci.deb])) : 0;
            const cre = ci.cre !== "" ? Math.abs(parseAmount(rw[+ci.cre])) : 0;
            amount = cre - deb;
          }
          amount *= inv;
          if (!amount) return;
          const label = String(rw[ci.l] || "Opération").slice(0, 120);
          target.push({ id: uid(), date, label, amount, category: autoCategory(label, scope) || (amount >= 0 ? (isPro ? "Ventes & prestations" : "Autres revenus") : (isPro ? "Autres charges" : "Divers")), accountId: ci.acc || "", imported: true });
          n++;
        });
        closeModal(); save(); render(); toast(`${n} opération(s) importée(s)`);
      };
    },
  });
}

        { name: "Sans rendement", color: "var(--s4)", points: projection(t.net, avgSave, 0, 10) },
      ],
    })}

function projection(start, monthly, rate, years) {
  const y0 = new Date().getFullYear(); const out = []; let v = start;
  for (let y = 0; y <= years; y++) {
    if (y) for (let m = 0; m < 12; m++) v = v * (1 + rate / 100 / 12) + monthly;
    out.push({ x: String(y0 + y), y: Math.round(v) });
  }
  return out;
}
function renderSim() {
  const s = ui.sim, years = clamp(Math.round(nb(s.years)) || 1, 1, 60);
  const pts = [], inv = []; let v = nb(s.initial), paid = nb(s.initial);
  const y0 = new Date().getFullYear();
  for (let y = 0; y <= years; y++) {
    if (y) for (let m = 0; m < 12; m++) { v = v * (1 + nb(s.rate) / 100 / 12) + nb(s.monthly); paid += nb(s.monthly); }
    pts.push({ x: String(y0 + y), y: Math.round(v) }); inv.push({ x: String(y0 + y), y: Math.round(paid) });
  }
  const gain = v - paid;
  const el = $("#simres"); if (!el) return;
  el.innerHTML = `<div class="grid g-3" style="gap:12px;margin-bottom:14px">
      ${statHtml(`Capital dans ${years} an(s)`, money(v))}
      ${statHtml("Total versé", money(paid))}
      ${statHtml("Intérêts générés", `<span class="pos">${money(gain)}</span>`, `<span class="muted">${paid ? ((gain / paid) * 100).toFixed(0) : 0} % du capital versé</span>`)}
    </div>
    ${chart({ type: "line", height: 230, zero: true, series: [{ name: "Capital avec rendement", color: "var(--s1)", points: pts }, { name: "Versements cumulés", color: "var(--s4)", points: inv }] })}`;
  hydrateCharts();
}

function cashSeries(n = 12) {
  const c = C(), months = ymRange(curYM(), n);

  for (let i = months.length - 1; i >= 0; i--) { out.unshift({ x: months[i], y: Math.round(v) }); v -= flows[months[i]] || 0; }
  return out;
}

/* ==================================================================
   SYNCHRONISATION SUPABASE (optionnelle)
   ================================================================== */
const SESS_KEY = "patrimoine.supabase.session";
const Supa = {
  cfg: () => state.settings.supabase,
  session() { try { return JSON.parse(localStorage.getItem(SESS_KEY) || "null"); } catch (e) { return null; } },
  setSession(s) { try { s ? localStorage.setItem(SESS_KEY, JSON.stringify(s)) : localStorage.removeItem(SESS_KEY); } catch (e) { } },
  configured() { const c = Supa.cfg(); return !!(c.url && c.anonKey); },
  enabled() { return Supa.configured() && !!Supa.session(); },
  status() { return Supa.enabled() ? "on" : Supa.configured() ? "err" : ""; },
  label() { return Supa.enabled() ? "Synchronisé" : Supa.configured() ? "Non connecté" : "Données locales"; },
  headers(auth = true) {
    const c = Supa.cfg(), s = Supa.session();
    const h = { apikey: c.anonKey, "Content-Type": "application/json" };
    if (auth && s) h.Authorization = "Bearer " + s.access_token;
    return h;
  },
  async auth(path, body) {
    const c = Supa.cfg();
    const r = await fetch(`${c.url}/auth/v1/${path}`, { method: "POST", headers: Supa.headers(false), body: JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error_description || j.msg || j.message || j.error || "Erreur d'authentification");
    return j;
  },
  async signIn(email, password) {
    const j = await Supa.auth("token?grant_type=password", { email, password });
    Supa.setSession({ access_token: j.access_token, refresh_token: j.refresh_token, user_id: j.user.id });
    state.settings.supabase.email = email; save(false);
    await Supa.pull(true);
    toast("Connecté — données synchronisées");
  },
  async signUp(email, password) {
    await Supa.auth("signup", { email, password });
    try { await Supa.signIn(email, password); }
    catch (e) { toast("Compte créé. Confirmez votre e-mail puis connectez-vous."); }
  },
  async refresh() {
    const s = Supa.session(); if (!s) throw new Error("Session absente");
    const j = await Supa.auth("token?grant_type=refresh_token", { refresh_token: s.refresh_token });
    Supa.setSession({ access_token: j.access_token, refresh_token: j.refresh_token, user_id: j.user.id });
  },
  signOut() { Supa.setSession(null); render(); toast("Déconnecté"); },
  async rest(url, opts, retry = true) {
    const r = await fetch(url, opts);
    if (r.status === 401 && retry) { await Supa.refresh(); opts.headers = Supa.headers(); return Supa.rest(url, opts, false); }
    if (!r.ok) throw new Error("Supabase : " + r.status + " " + (await r.text()).slice(0, 140));
    return r;
  },
  async push(silent = false) {
    if (!Supa.enabled()) { if (!silent) toast("Configurez la synchronisation d'abord", true); return; }
    const c = Supa.cfg(), s = Supa.session();
    try {
      await Supa.rest(`${c.url}/rest/v1/patrimoine`, {
        method: "POST", headers: { ...Supa.headers(), Prefer: "resolution=merge-duplicates,return=minimal" },
        body: JSON.stringify({ user_id: s.user_id, data: state, updated_at: state.updatedAt }),
      });
      state.settings.supabase.lastSync = new Date().toISOString();
      try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { }
      if (!silent) { render(); toast("Données envoyées"); }
    } catch (e) { if (!silent) toast(e.message, true); else console.warn(e); }
  },
  async pull(silent = false) {
    if (!Supa.enabled()) { if (!silent) toast("Configurez la synchronisation d'abord", true); return; }
    const c = Supa.cfg(), s = Supa.session();
    try {
      const r = await Supa.rest(`${c.url}/rest/v1/patrimoine?select=data,updated_at&user_id=eq.${s.user_id}`, { headers: Supa.headers() });
      const rows = await r.json();
      if (!rows.length) { await Supa.push(true); return; }
      const remote = rows[0];
      if (!remote.data || !remote.data.version) return;
      if (!silent && new Date(remote.data.updatedAt || 0) < new Date(state.updatedAt || 0)) {
        confirmDialog("Données locales plus récentes", "La sauvegarde en ligne est plus ancienne que vos données locales. Voulez-vous quand même la restaurer (vos modifications locales seront perdues) ?", () => {
          state = migrate(remote.data); save(false); render(); toast("Données restaurées");
        }, "Restaurer");
        return;
      }
      if (new Date(remote.data.updatedAt || 0) > new Date(state.updatedAt || 0)) {
        state = migrate(remote.data);
        state.settings.supabase.lastSync = new Date().toISOString();
        save(false); render(); toast("Données récupérées depuis le cloud");
      } else if (!silent) toast("Déjà à jour");
    } catch (e) { if (!silent) toast(e.message, true); else console.warn(e); }
  },
};

/* ==================================================================
   EXPORT / IMPORT
   ================================================================== */
function download(name, content, type = "application/json") {
  const url = URL.createObjectURL(new Blob([content], { type: type + ";charset=utf-8" }));
  const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 500);
}
function exportJson() {
  download(`patrimoine-${todayISO()}.json`, JSON.stringify(state, null, 2));
  toast("Sauvegarde exportée");
}
function importJson() {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try {
        const data = JSON.parse(rd.result);
        if (!data || !data.personal) throw new Error("Format invalide");
        confirmDialog("Remplacer les données", "Toutes les données actuelles de ce navigateur seront remplacées par le contenu du fichier.", () => {
          state = migrate(data); save(); render(); toast("Données importées");
        }, "Remplacer");
      } catch (e) { toast("Fichier illisible : " + e.message, true); }
    };
    rd.readAsText(f);
  };
  inp.click();
}
function exportCsv(scope) {
  const pro = scope === "pro";
  const txs = pro ? C().transactions : P().transactions;
  const accs = pro ? C().accounts : P().accounts;
  const accName = id => (accs.find(a => a.id === id) || {}).name || "";
  const head = ["Date", "Libellé", "Catégorie", "Compte", "Montant", ...(pro ? ["Taux TVA"] : [])];
  const rows = [...txs].sort((a, b) => (a.date || "").localeCompare(b.date || "")).map(t => [
    t.date, t.label, t.category || "", accName(t.accountId), String(nb(t.amount)).replace(".", ","), ...(pro ? [String(nb(t.vatRate))] : []),
  ]);
  const csv = [head, ...rows].map(r => r.map(c => `"${String(c ?? "").replace(/"/g, '""')}"`).join(";")).join("\n");
  download(`operations-${pro ? "alpega" : "perso"}-${todayISO()}.csv`, "﻿" + csv, "text/csv");
  toast("Export CSV généré");
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-nav],[data-add],[data-act],[data-patsub],[data-bizsub],[data-range],[data-per]");
  if (!el) return;
  const d = el.dataset;
  if (d.nav) return go(d.nav);
  if (d.patsub) { ui.patSub = d.patsub; return render(); }
  if (d.bizsub) { ui.bizSub = d.bizsub; return render(); }
  if (d.range) { ui.range = +d.range; return render(); }
  if (d.per) { ui.period = ymAdd(ui.period, d.per === "next" ? 1 : -1); if (ui.period > curYM()) ui.period = curYM(); return render(); }
  if (d.add) return editItem(d.add, null);
  const path = (el.closest("[data-list]") || {}).dataset?.list;
  switch (d.act) {
    case "edit": return editItem(path, d.id);
    case "del": return delItem(path, d.id);
    case "paid": { const i = C().invoices.find(x => x.id === d.id); if (i) { i.status = "payee"; i.datePaid = todayISO(); save(); render(); toast("Facture encaissée"); } return; }
    case "theme": state.settings.theme = isDark() ? "light" : "dark"; save(); return render();
    case "hide": state.settings.hideAmounts = !state.settings.hideAmounts; save(); return render();
    case "budgets": return budgetsModal();
    case "csv-perso": return importCsvModal("perso");
    case "csv-pro": return importCsvModal("pro");
    case "export-json": return exportJson();
    case "import-json": return importJson();
    case "export-csv-perso": return exportCsv("perso");
    case "export-csv-pro": return exportCsv("pro");
    case "reset": return confirmDialog("Tout effacer", "Toutes vos données locales seront définitivement supprimées. Pensez à exporter une sauvegarde avant.", () => {
      state = blank(); save(); render(); toast("Données effacées");
    }, "Tout effacer");
    case "cats-save": {
      const g = id => ($("#" + id).value || "").split("\n").map(s => s.trim()).filter(Boolean);
      state.settings.catExp = g("cat-exp"); state.settings.catInc = g("cat-inc");
      state.settings.catBizExp = g("cat-bexp"); state.settings.catBizInc = g("cat-binc");
      save(); render(); return toast("Catégories enregistrées");
    }
    case "rule-add": return formModal({
      title: "Règle de catégorisation",
      fields: [
        { key: "kw", label: "Mot-clé contenu dans le libellé", required: true, ph: "Ex. carrefour" },
        { key: "scope", label: "Portée", type: "select", options: [{ v: "perso", l: "Personnel" }, { v: "pro", l: "SARL ALPEGA" }] },
        { key: "cat", label: "Catégorie à appliquer", type: "select", options: () => [...allCats(), ...allBizCats()] },
      ],
      onSubmit(v) { state.settings.rules.push(v); save(); render(); toast("Règle ajoutée"); },
    });
    case "rule-del": state.settings.rules.splice(+d.i, 1); save(); render(); return toast("Règle supprimée");
    case "supa-signin": case "supa-signup": {
      const email = ($("#sb-mail") || {}).value?.trim(), pwd = ($("#sb-pwd") || {}).value;
      state.settings.supabase.url = ($("#sb-url").value || "").trim().replace(/\/$/, "");
      state.settings.supabase.anonKey = ($("#sb-key").value || "").trim();
      save(false);
      if (!Supa.configured()) return toast("Renseignez l'URL et la clé anon du projet", true);
      if (!email || !pwd) return toast("E-mail et mot de passe requis", true);
      el.disabled = true;
      (d.act === "supa-signin" ? Supa.signIn(email, pwd) : Supa.signUp(email, pwd))
        .then(() => render()).catch(err => toast(err.message, true)).finally(() => { el.disabled = false; });
      return;
    }
    case "supa-push": return void Supa.push();
    case "supa-pull": return void Supa.pull();
    case "supa-signout": return Supa.signOut();
  }
});

function installManifest() {
  try {
    const icon = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232a78d6'/%3E%3Cpath d='M14 42l11-13 9 8 16-19' fill='none' stroke='%23fff' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E";
    const mf = { name: "Patrimoine — " + (C().name || "SARL ALPEGA"), short_name: "Patrimoine", start_url: location.href.split("#")[0], display: "standalone", background_color: "#f9f9f7", theme_color: "#2a78d6", icons: [{ src: icon, sizes: "any", type: "image/svg+xml", purpose: "any" }] };
    const l = document.createElement("link"); l.rel = "manifest";
    l.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], { type: "application/manifest+json" }));
    document.head.appendChild(l);
  } catch (e) { }
}
function init() {
  load();
  installManifest();
  const h = location.hash.slice(1); if (VIEWS[h]) ui.view = h;
  applyTheme();
  touchSnapshot();
  save(false);
  render();
  if (Supa.enabled()) Supa.pull(true);
}
